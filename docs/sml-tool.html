<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SML Assessment Tool (Local WebAssembly)</title>
    <!-- load Streamlit mountable styles locally to bypass corporate firewalls and MIME-type issues -->
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Ensure full width and height with clean padding */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- load Streamlit mountable engine locally -->
    <script src="stlite.js"></script>
    <script>
      // Generate a dynamic timestamp to completely bypass browser and GitHub Pages caching
      const cacheBust = new Date().getTime();

      stlite.mount({
        // Define required Python packages to be installed in the browser environment
        requirements: ["pandas", "plotly", "openpyxl"],
        entrypoint: "sml_app.py",
        files: {
          // Map local files with dynamic cache busting URL parameters
          "sml_app.py": {
            url: "sml_app.py?cb=" + cacheBust
          },
          "sml_data.json": {
            url: "sml_data.json?cb=" + cacheBust
          },
          "SDT_ES3_Logo_4c_neg_RGB.svg": {
            url: "SDT_ES3_Logo_4c_neg_RGB.svg?cb=" + cacheBust
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
