<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SML Assessment Tool (WebAssembly)</title>
    <!-- CSS von unpkg laden (wird von Firewalls seltener blockiert als jsdelivr) -->
    <link rel="stylesheet" href="https://unpkg.com/@stlite/mountable@0.59.0/build/style.css" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- WebAssembly Engine von unpkg laden -->
    <script src="https://unpkg.com/@stlite/mountable@0.59.0/build/stlite.js"></script>
    <script>
      const cacheBust = new Date().getTime();

      stlite.mount({
        requirements: ["pandas", "plotly", "openpyxl"],
        entrypoint: "sml_app.py",
        files: {
          "sml_app.py": {
            url: "sml_app.py?cb=" + cacheBust
          },
          "sml_data.json": {
            url: "sml_data.json?cb=" + cacheBust
          },
          "SDT_ES3_Logo_4c_neg_RGB.svg": {
            url: "SDT_ES3_Logo_4c_neg_RGB.svg?cb=" + cacheBust
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
