name: Deploy ES³ SML Documentation to GitHub Pages

on:
  push:
    branches:
      - main # Generate Documentation from main
      - UpdateDocs # Only for Testing

    paths:
      - 'docs/sml_data.json'
      - 'generate_docs_from_json.py'
      - 'mkdocs.yml'
      - 'docs/**'

  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docs/sml_data.json'
      - 'docs/generate_docs_from_json.py'
      - 'mkdocs.yml'
      - 'docs/**'
  
  workflow_dispatch:

# Set permissions for deployment on GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one parallel deployment process only
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: Generate Docs & Deploy MkDocs on github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: 
          token: ${{ secrets.GITHUB_TOKEN }} 
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Cache Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0        
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install MkDocs & Material Theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs
          pip install mkdocs-material

      - name: Download and install stlite-mountable dependency
        run: |
          # Erstellt das Zielverzeichnis im docs-Ordner
          mkdir -p docs/stlite
          
          # Lädt die offizielle Tarball-Dependency von npm herunter
          curl -L https://registry.npmjs.org/@stlite/mountable/-/mountable-0.59.0.tgz -o mountable.tgz
          
          # Entpackt die Quelldateien
          tar -xzf mountable.tgz
          
          # Kopiert den gesamten Build (inkl. aller Worker und Chunks) in Ihre Dokumentation
          cp -r package/build/* docs/stlite/
          
          # Räumt temporäre Dateien auf
          rm -rf package mountable.tgz

      - name: Generate Markdown Pages from JSON Master
        run: |
          python generate_docs_from_json.py
          
      - name: Build MkDocs Site
        run: mkdocs build --strict

      - name: Commit Generated Documentation (on Push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dimensions/ docs/overview.md
          git diff-index --quiet HEAD || git commit -m "docs: auto-generate dimension pages from sml_data.json [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Artifact # Upload artefact only at PUSH to main
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "site" # Standard Outpit Folder of MkDocs

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
